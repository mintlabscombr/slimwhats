openapi: 3.1.0
info:
  title: whatsmeow-api
  version: 0.1.0
  description: |
    REST API on top of go.mau.fi/whatsmeow. Multi-instance WhatsApp
    number management with a web manager UI and a per-instance API
    for sending text + interactive buttons.

    Two auth surfaces:
    - **Manager** (env-stored password → session cookie) — `/admin/*` and `/admin/api/*`
    - **Per-instance** (`Authorization: Bearer sk_live_...`) — `/api/v1/*`

servers:
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: manager
    description: Manager login + UI session
  - name: instances
    description: Instance CRUD (manager-only)
  - name: instance-lifecycle
    description: Connect / disconnect / reconnect / delete (manager-only)
  - name: webhook
    description: Webhook config + delivery log (manager-only)
  - name: messaging
    description: Send messages (per-instance API key)
  - name: health
    description: Liveness / readiness

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: ok } }

  /admin/login:
    get:
      tags: [manager]
      summary: Login page (HTML)
      security: []
      responses: { "200": { description: Login form } }
    post:
      tags: [manager]
      summary: Submit login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: { password: { type: string } }
      responses:
        "200":
          description: Authenticated; `__Host-session` or `session` cookie set
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Rate-limited (5 failures / 10 min / IP)
          headers:
            Retry-After: { schema: { type: integer } }

  /admin/logout:
    post:
      tags: [manager]
      summary: Invalidate the current session
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Logged out } }

  /admin/api/instances:
    get:
      tags: [instances]
      summary: List instances
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 500 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances: { type: array, items: { $ref: "#/components/schemas/InstanceView" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [instances]
      summary: Create an instance
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
                api_key:
                  type: string
                  pattern: "^sk_live_[A-Za-z0-9]{16,128}$"
                  description: Optional. Auto-generated (43 base64url chars) if omitted.
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  api_key: { type: string, description: "Plaintext API key — SHOWN ONCE" }
                  status: { $ref: "#/components/schemas/InstanceStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Name already taken
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/instances/{id}:
    get:
      tags: [instances]
      summary: Get one instance
      security: [{ sessionCookie: [] }]
      parameters: [ { $ref: "#/components/parameters/InstanceId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [instance-lifecycle]
      summary: Delete an instance (manager-only)
      description: |
        Evicts the instance from the in-memory manager, removes its DB row.
        CASCADE cleans up its webhook_deliveries and instance_logs. The
        whatsmeow device record in the same DB is intentionally preserved
        so re-creation with the same name does not require re-pairing.
      security: [{ sessionCookie: [] }]
      parameters: [ { $ref: "#/components/parameters/InstanceId" } ]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, example: deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/instances/{id}/connect:
    post:
      tags: [instance-lifecycle]
      summary: Connect a paired instance
      security: [{ sessionCookie: [] }]
      parameters: [ { $ref: "#/components/parameters/InstanceId" } ]
      responses:
        "202":
          description: Connecting
        "200":
          description: Already connected (no-op)
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not paired — call GET /qr first
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/instances/{id}/disconnect:
    post:
      tags: [instance-lifecycle]
      summary: Disconnect an instance
      description: |
        Sets the expected-disconnect flag so whatsmeow's auto-reconnect
        does not immediately re-bring the client up.
      security: [{ sessionCookie: [] }]
      parameters: [ { $ref: "#/components/parameters/InstanceId" } ]
      responses:
        "200":
          description: Disconnected
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/instances/{id}/reconnect:
    post:
      tags: [instance-lifecycle]
      summary: Reconnect an instance (disconnect + start)
      security: [{ sessionCookie: [] }]
      parameters: [ { $ref: "#/components/parameters/InstanceId" } ]
      responses:
        "202":
          description: Reconnecting
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/instances/{id}/qr:
    get:
      tags: [instances]
      summary: Get the current QR code for an unpaired instance
      security: [{ sessionCookie: [] }]
      parameters: [ { $ref: "#/components/parameters/InstanceId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr: { type: string, description: "Raw QR code string" }
                  format: { type: string, example: raw }
                  issued_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already paired
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/instances/{id}/status:
    get:
      tags: [instances]
      summary: Get instance status
      security: [{ sessionCookie: [] }]
      parameters: [ { $ref: "#/components/parameters/InstanceId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  status: { $ref: "#/components/schemas/InstanceStatus" }
                  connected: { type: boolean }
                  logged_in: { type: boolean }
                  phone: { type: string }
                  jid: { type: string }
                  lid: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/instances/{id}/logs:
    get:
      tags: [instances]
      summary: List instance log entries
      description: |
        Returns a paginated, filterable stream of instance_logs rows.
        Every whatsmeow event is mirrored here by the event subscriber
        in main.go, in parallel with the outbound webhook pipeline.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { in: query, name: level, schema: { type: string, enum: [info, warn, error, debug] } }
        - { in: query, name: category, schema: { type: string, enum: [connect, message, receipt, group, contact, presence, system] } }
        - { in: query, name: since, schema: { type: string, format: date-time }, description: "RFC3339 timestamp; only entries at or after this time" }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 500 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance_id: { type: string }
                  limit: { type: integer }
                  offset: { type: integer }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
        "400":
          description: Invalid since param
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/instances/{id}/webhook:
    put:
      tags: [webhook]
      summary: Set or clear the webhook URL + secret for an instance
      description: |
        Empty body clears the webhook. The secret is encrypted at rest
        with AES-256-GCM (key = APP_ENCRYPTION_KEY) and surfaced as
        `X-Webhook-Secret` on every outbound POST.
      security: [{ sessionCookie: [] }]
      parameters: [ { $ref: "#/components/parameters/InstanceId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, description: "https://... or http://localhost*" }
                secret: { type: string, minLength: 16, maxLength: 128 }
      responses:
        "200":
          description: Configured or cleared
        "400":
          description: Invalid URL or secret length
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/instances/{id}/api-key:
    put:
      tags: [instances]
      summary: Set a custom API key
      description: |
        Operator-supplied key. Must match `^sk_live_[A-Za-z0-9]{16,128}$`.
        The old key dies immediately — clients using it will get 401.
      security: [{ sessionCookie: [] }]
      parameters: [ { $ref: "#/components/parameters/InstanceId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, pattern: "^sk_live_[A-Za-z0-9]{16,128}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  api_key_masked: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/instances/{id}/api-key/rotate:
    post:
      tags: [instances]
      summary: Auto-generate a new API key
      description: Returns the new plaintext key exactly once. Old key dies immediately.
      security: [{ sessionCookie: [] }]
      parameters: [ { $ref: "#/components/parameters/InstanceId" } ]
      responses:
        "200":
          description: New key generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  api_key: { type: string, description: "Plaintext — SHOWN ONCE" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/instances/{id}/api-key/reveal:
    post:
      tags: [instances]
      summary: Reveal the plaintext API key
      description: |
        Returns the stored API key in plaintext. Requires
        `manager_password` in the body — the session cookie alone is NOT
        sufficient. This is a deliberate second factor: if a session
        cookie is leaked, the attacker still can't extract API keys
        without also knowing the manager password.

        The API key is stored as plaintext in the DB (post 2026-07-29
        drop-bcrypt, matching the webhook secret pattern). Anyone with
        read access to the DB can see all API keys; protect the DB file
        accordingly.
      security: [{ sessionCookie: [] }]
      parameters: [ { $ref: "#/components/parameters/InstanceId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manager_password]
              properties:
                manager_password: { type: string }
      responses:
        "200":
          description: Plaintext API key
          content:
            application/json:
              schema:
                type: object
                required: [id, api_key]
                properties:
                  id: { type: string, format: uuid }
                  api_key: { type: string, description: "The plaintext API key" }
        "401":
          description: manager_password mismatch
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/instances/{id}/webhook-deliveries:
    get:
      tags: [webhook]
      summary: List recent webhook deliveries for an instance
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { in: query, name: status, schema: { type: string, enum: [pending, succeeded, failed, dead] } }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        "200":
          description: OK
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/ping:
    get:
      tags: [messaging]
      summary: Sanity check (per-instance API key)
      security: [{ apiKey: [] }]
      responses: { "200": { description: OK } }

  /api/v1/messages/text:
    post:
      tags: [messaging]
      summary: Send a text message
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, body]
              properties:
                to: { type: string, description: "Phone or JID (e.g. 5511999999999 or 5511999999999@s.whatsapp.net)" }
                body: { type: string }
                id: { type: string, description: "Optional message ID; auto-generated if omitted" }
                delay: { type: integer, minimum: 0, maximum: 30000, description: "Typing simulation delay in ms" }
                mentions: { type: array, items: { type: string } }
                mention_all: { type: boolean }
                quoted:
                  type: object
                  properties:
                    message_id: { type: string }
                    participant: { type: string }
                forwarding_score: { type: integer }
                format_jid: { type: boolean }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  timestamp: { type: integer }
                  server_id: { type: string }
                  chat: { type: string }
                  is_group: { type: boolean }
                  type: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Rate limited (20/60s/JID)
          headers:
            Retry-After: { schema: { type: integer } }

  /api/v1/messages/buttons:
    post:
      tags: [messaging]
      summary: Send interactive buttons (reply / url / copy / call / pix)
      description: |
        Send a message with 1-3 interactive buttons. Supported button types:

        - **reply** — quick-reply buttons (up to 3 per message). Cannot be combined with other types.
        - **url** — opens a URL when tapped. Must be https:// (or http://localhost in dev).
        - **copy** — copies a code to the user's clipboard.
        - **call** — initiates a phone call to a number (E.164 format, e.g. `+5511999999999`).
        - **pix** — Brazilian instant payment. Must be the only button in the message.
          Amount in **cents** (BRL): `5000` = R$50,00.

        The `text` field (max 20 chars) is what the user sees on the button itself.
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, body, buttons]
              properties:
                to: { type: string, example: "5511999999999" }
                body: { type: string, example: "Pick one" }
                header: { type: string, example: "My header" }
                footer: { type: string, example: "Tap to open" }
                id: { type: string, example: "optional-message-id" }
                delay: { type: integer, example: 0, description: "Pre-send typing delay in ms" }
                buttons:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    oneOf:
                      - $ref: "#/components/schemas/ReplyButton"
                      - $ref: "#/components/schemas/UrlButton"
                      - $ref: "#/components/schemas/CopyButton"
                      - $ref: "#/components/schemas/CallButton"
                      - $ref: "#/components/schemas/PixButton"
                  discriminator:
                    propertyName: type
                    mapping:
                      reply: "#/components/schemas/ReplyButton"
                      url:   "#/components/schemas/UrlButton"
                      copy:  "#/components/schemas/CopyButton"
                      call:  "#/components/schemas/CallButton"
                      pix:   "#/components/schemas/PixButton"
            examples:
              url_button:
                summary: Single URL button
                value:
                  to: "5511999999999"
                  body: "Check this out"
                  header: "My header"
                  footer: "Tap to open"
                  buttons:
                    - { type: url, text: "Open site", url: "https://example.com/" }
              copy_button:
                summary: Single copy-code button
                value:
                  to: "5511999999999"
                  body: "Coupon inside"
                  footer: "Tap to copy"
                  buttons:
                    - { type: copy, text: "Copy code", code: "PROMO2026" }
              call_button:
                summary: Single call button
                value:
                  to: "5511999999999"
                  body: "Need help?"
                  header: "Support"
                  footer: "Free"
                  buttons:
                    - { type: call, text: "Call us", phone: "+5511999999999" }
              reply_buttons:
                summary: Quick-reply buttons (max 3)
                value:
                  to: "5511999999999"
                  body: "Did you like it?"
                  buttons:
                    - { type: reply, text: "Yes", id: "yes" }
                    - { type: reply, text: "No",  id: "no"  }
                    - { type: reply, text: "Maybe", id: "maybe" }
              pix_button:
                summary: Pix payment (must be the only button)
                value:
                  to: "5511999999999"
                  body: "Donation"
                  header: "Support us"
                  footer: "Thank you"
                  buttons:
                    - type: pix
                      text: "Pay with Pix"
                      currency: "BRL"
                      name: "Your Name"
                      key_type: email
                      key: "you@example.com"
                      amount: 5000
              mixed_url_copy:
                summary: Mixed: url + copy (no reply/pix)
                value:
                  to: "5511999999999"
                  body: "Choose an action"
                  header: "Header"
                  footer: "Footer"
                  buttons:
                    - { type: url,  text: "Open site",  url: "https://example.com/" }
                    - { type: copy, text: "Copy code",  code: "code-code" }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, example: "3EB0B88686AA757AFD05B2" }
                  timestamp: { type: string, format: date-time, example: "2026-07-30T02:32:06Z" }
                  server_id: { type: integer, example: 0 }
                  chat: { type: string, example: "5511999999999@s.whatsapp.net" }
                  is_group: { type: boolean, example: false }
                  type: { type: string, enum: [ButtonsMessage, InteractiveMessage], example: InteractiveMessage }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Rate limited (20/60s/JID)
          headers: { Retry-After: { schema: { type: integer } } }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "whatsmeow-api-key (sk_live_...)"

  parameters:
    InstanceId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Bad request
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Unauthorized
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }

    InstanceStatus:
      type: string
      enum: [created, pairing, connected, disconnected, logged_out, error]

    LogEntry:
      type: object
      properties:
        id: { type: string }
        instance_id: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        level: { type: string, enum: [info, warn, error, debug] }
        category: { type: string, enum: [connect, message, receipt, group, contact, presence, system] }
        message: { type: string }
        data:
          type: object
          additionalProperties: true
          description: Per-event payload (msg_id, from, chat, etc.)

    InstanceView:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/InstanceStatus" }
        phone: { type: string }
        jid: { type: string }
        lid: { type: string }
        webhook_url: { type: string }
        webhook_configured: { type: boolean }
        api_key_masked: { type: string, description: "Masked representation (sk_live_••••••••XXXX, last 4 of the plaintext key)" }
        api_key_set_at: { type: string, format: date-time }
        connected_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---- Button shapes (1-of discriminated union on `type`) ----
    ReplyButton:
      type: object
      required: [type, text, id]
      properties:
        type: { type: string, enum: [reply] }
        text: { type: string, description: "Button label (max 20 chars)" }
        id: { type: string, description: "Reply id echoed back when the user taps" }
      example:
        type: reply
        text: "Yes"
        id: "yes"

    UrlButton:
      type: object
      required: [type, text, url]
      properties:
        type: { type: string, enum: [url] }
        text: { type: string, description: "Button label (max 20 chars)" }
        url: { type: string, format: uri, description: "Must be https:// (or http://localhost in dev); max 2048 chars" }
      example:
        type: url
        text: "Open site"
        url: "https://example.com/"

    CopyButton:
      type: object
      required: [type, text, code]
      properties:
        type: { type: string, enum: [copy] }
        text: { type: string, description: "Button label (max 20 chars)" }
        code: { type: string, description: "Copied to the user's clipboard; max 256 chars" }
      example:
        type: copy
        text: "Copy code"
        code: "PROMO2026"

    CallButton:
      type: object
      required: [type, text, phone]
      properties:
        type: { type: string, enum: [call] }
        text: { type: string, description: "Button label (max 20 chars)" }
        phone: { type: string, description: "E.164 number with leading + (e.g. +5511999999999)" }
      example:
        type: call
        text: "Call us"
        phone: "+5511999999999"

    PixButton:
      type: object
      required: [type, text, key, key_type, merchant_name, amount]
      properties:
        type: { type: string, enum: [pix] }
        text: { type: string, description: "Button label (max 20 chars)" }
        key: { type: string, description: "Pix key value" }
        key_type:
          type: string
          enum: [phone, email, cpf, cnpj, random]
          description: "phone→PHONE, email→EMAIL, cpf→CPF, cnpj→CNPJ, random→EVP"
        merchant_name: { type: string, description: "Displayed to the payer" }
        amount: { type: integer, description: "In cents (BRL). Example: 5000 = R$50,00" }
      example:
        type: pix
        text: "Pay with Pix"
        currency: "BRL"
        name: "Your Name"
        key_type: email
        key: "you@example.com"
