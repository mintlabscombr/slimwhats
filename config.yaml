# whatsmeow-api default config
#
# Non-secret defaults. Sensitive values (APP_MANAGER_PASSWORD) are
# env-only and never written to disk.
#
# Env vars override any value set here. APP_HTTP_ADDR accepts a bare
# port ("9090" -> ":9090" on all interfaces), the canonical ":9090"
# form, or a specific host ("127.0.0.1:9090"). See config.go's
# normalizeHTTPAddr for details.

http_addr: "8080"
db_driver: "sqlite3"
db_dsn: "file:data/whatsmeow-api.db?_foreign_keys=on"
manager_username: "admin"

# Comma-separated list of CIDRs trusted to set X-Forwarded-For.
# Empty = trust nothing; use the direct remote address.
# trusted_proxies:
#   - "10.0.0.0/8"
#   - "127.0.0.1/32"
